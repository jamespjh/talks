---
- name: Copy from the local build of the site to the remote
  # Each deploy overwrites the same folder; _site is downloaded by jh-infrastructure's deploy_talks.yml.
  # Under /var/www the files get SELinux's httpd_sys_content_t label by default, so no chcon is needed.
  ansible.builtin.copy:
    src: ../_site/
    dest: /var/www/builds/talks/
  become: true

- name: Point the served folder at the copy
  ansible.builtin.file:
    src: /var/www/builds/talks
    dest: /var/www/html/talks
    state: link
  become: true

- name: Set up the apache config
  become: true
  ansible.builtin.copy:
    src: talks.conf
    dest: /etc/httpd/conf.d/talks.conf
  notify: Restart httpd
